<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>스탑워치</title>
<style>
  :root {
    --bg: #f5f5f7; --card: #ffffff; --text: #1d1d1f; --muted: #86868b;
    --line: #e5e5ea; --start: #34c759; --stop: #ff3b30; --neutral: #d1d1d6;
    --best: #0a84ff; --worst: #ff9500;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #000; --card: #1c1c1e; --text: #f5f5f7; --muted: #98989d;
      --line: #2c2c2e; --neutral: #3a3a3c;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; background: var(--bg); color: var(--text);
    font-family: -apple-system, "Segoe UI", "Malgun Gothic", sans-serif;
    display: flex; justify-content: center; padding: 48px 16px;
  }
  .wrap { width: 100%; max-width: 420px; }
  .time {
    font-variant-numeric: tabular-nums; font-size: clamp(48px, 16vw, 76px);
    font-weight: 200; text-align: center; letter-spacing: -1px; margin: 24px 0 36px;
  }
  .controls { display: flex; justify-content: space-between; margin-bottom: 28px; }
  button {
    width: 84px; height: 84px; border-radius: 50%; border: none; cursor: pointer;
    font-size: 16px; font-weight: 600; color: #fff; transition: transform .08s, opacity .2s;
  }
  button:active { transform: scale(.94); }
  button:disabled { opacity: .4; cursor: default; }
  #startBtn { background: var(--start); }
  #startBtn.running { background: var(--stop); }
  #lapBtn { background: var(--neutral); color: var(--text); }
  ul { list-style: none; padding: 0; margin: 0; border-top: 1px solid var(--line); }
  li {
    display: flex; justify-content: space-between; padding: 12px 4px;
    border-bottom: 1px solid var(--line); font-variant-numeric: tabular-nums;
  }
  li.best { color: var(--best); }
  li.worst { color: var(--worst); }
  .hint { text-align: center; color: var(--muted); font-size: 13px; margin-top: 20px; }

  /* 춤추는 펭귄 */
  .stage { display: flex; flex-direction: column; align-items: center; margin-bottom: 24px; }
  .dancer { width: 150px; height: 170px; overflow: visible; }
  .dancer * { transform-box: fill-box; }
  .dancer .body-grp { transform-origin: 50% 100%; animation: sway .8s ease-in-out infinite; }
  .dancer .whole { animation: bounce .4s ease-in-out infinite; }
  .dancer .arm-l { transform-origin: 90% 15%; animation: waveL .4s ease-in-out infinite alternate; }
  .dancer .arm-r { transform-origin: 10% 15%; animation: waveR .4s ease-in-out infinite alternate; }
  .dancer .foot-l { transform-origin: 50% 50%; animation: stepL .4s ease-in-out infinite alternate; }
  .dancer .foot-r { transform-origin: 50% 50%; animation: stepR .4s ease-in-out infinite alternate; }
  .dancer .note { animation: float 1.6s ease-out infinite; opacity: 0; }
  .dancer .note.n2 { animation-delay: .8s; }
  .dancer .shadow { transform-origin: 50% 50%; animation: shadow .4s ease-in-out infinite; }
  .dancer :is(.body-grp, .whole, .arm-l, .arm-r, .foot-l, .foot-r, .note, .shadow) {
    animation-play-state: paused;
  }
  body.running .dancer :is(.body-grp, .whole, .arm-l, .arm-r, .foot-l, .foot-r, .note, .shadow) {
    animation-play-state: running;
  }
  body:not(.running) .dancer .note { visibility: hidden; }
  .stage-label { font-size: 13px; color: var(--muted); margin-top: 4px; }
  @keyframes sway   { 0%,100% { transform: rotate(-8deg); } 50% { transform: rotate(8deg); } }
  @keyframes bounce { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
  @keyframes waveL  { from { transform: rotate(10deg); } to { transform: rotate(-55deg); } }
  @keyframes waveR  { from { transform: rotate(55deg); } to { transform: rotate(-10deg); } }
  @keyframes stepL  { from { transform: translateY(0); } to { transform: translateY(-6px) rotate(-15deg); } }
  @keyframes stepR  { from { transform: translateY(-6px) rotate(15deg); } to { transform: translateY(0); } }
  @keyframes shadow { 0%,100% { transform: scaleX(1); } 50% { transform: scaleX(.8); } }
  @keyframes float  {
    0% { opacity: 0; transform: translate(0, 0); }
    20% { opacity: 1; }
    100% { opacity: 0; transform: translate(10px, -40px) rotate(20deg); }
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="time" id="display">00:00.00</div>
  <div class="controls">
    <button id="lapBtn" disabled>랩</button>
    <button id="startBtn">시작</button>
  </div>
  <div class="stage">
    <svg class="dancer" viewBox="0 0 150 170" aria-label="춤추는 펭귄">
      <ellipse class="shadow" cx="75" cy="160" rx="38" ry="6" fill="#000" opacity=".12"/>
      <g class="whole">
        <text class="note" x="118" y="40" font-size="20" fill="#0a84ff">♪</text>
        <text class="note n2" x="16" y="50" font-size="18" fill="#ff2d55">♫</text>
        <!-- 발 -->
        <ellipse class="foot-l" cx="58" cy="150" rx="13" ry="6" fill="#ff9f0a"/>
        <ellipse class="foot-r" cx="92" cy="150" rx="13" ry="6" fill="#ff9f0a"/>
        <g class="body-grp">
          <!-- 날개 -->
          <ellipse class="arm-l" cx="30" cy="100" rx="10" ry="24" fill="#2b5c9e"/>
          <ellipse class="arm-r" cx="120" cy="100" rx="10" ry="24" fill="#2b5c9e"/>
          <!-- 몸 -->
          <ellipse cx="75" cy="102" rx="44" ry="46" fill="#2b5c9e"/>
          <ellipse cx="75" cy="112" rx="31" ry="34" fill="#fff"/>
          <!-- 머리 -->
          <circle cx="75" cy="58" r="36" fill="#2b5c9e"/>
          <ellipse cx="75" cy="64" rx="27" ry="23" fill="#fff"/>
          <!-- 털모자 -->
          <path d="M41 50 Q75 6 109 50 Z" fill="#ffcc00"/>
          <rect x="39" y="45" width="72" height="10" rx="5" fill="#ff6b6b"/>
          <circle cx="75" cy="18" r="8" fill="#ff6b6b"/>
          <!-- 눈 -->
          <circle cx="64" cy="64" r="5" fill="#1d1d1f"/>
          <circle cx="86" cy="64" r="5" fill="#1d1d1f"/>
          <circle cx="65.5" cy="62.5" r="1.6" fill="#fff"/>
          <circle cx="87.5" cy="62.5" r="1.6" fill="#fff"/>
          <!-- 볼 -->
          <ellipse cx="55" cy="74" rx="5" ry="3" fill="#ff8fa3" opacity=".8"/>
          <ellipse cx="95" cy="74" rx="5" ry="3" fill="#ff8fa3" opacity=".8"/>
          <!-- 부리 -->
          <path d="M68 72 Q75 82 82 72 Q75 75 68 72 Z" fill="#ff9f0a"/>
          <!-- 목도리 -->
          <rect x="44" y="88" width="62" height="9" rx="4.5" fill="#ff6b6b"/>
          <rect x="88" y="92" width="9" height="20" rx="4" fill="#ff6b6b"/>
        </g>
      </g>
    </svg>
    <div class="stage-label" id="stageLabel">시작을 누르면 춤춰요!</div>
  </div>
  <ul id="laps"></ul>
  <p class="hint">Space: 시작/정지 · L: 랩 · R: 초기화</p>
</div>
<script>
  const display = document.getElementById('display');
  const startBtn = document.getElementById('startBtn');
  const lapBtn = document.getElementById('lapBtn');
  const lapsEl = document.getElementById('laps');

  let running = false, startTime = 0, elapsed = 0, rafId = null;
  let laps = [], lastLapTotal = 0;

  function fmt(ms) {
    const cs = Math.floor(ms / 10) % 100;
    const s = Math.floor(ms / 1000) % 60;
    const m = Math.floor(ms / 60000) % 60;
    const h = Math.floor(ms / 3600000);
    const p = n => String(n).padStart(2, '0');
    return (h ? h + ':' : '') + p(m) + ':' + p(s) + '.' + p(cs);
  }

  const now = () => elapsed + (running ? performance.now() - startTime : 0);

  function tick() {
    display.textContent = fmt(now());
    rafId = requestAnimationFrame(tick);
  }

  function toggle() {
    if (running) {
      elapsed += performance.now() - startTime;
      running = false;
      cancelAnimationFrame(rafId);
      display.textContent = fmt(elapsed);
    } else {
      startTime = performance.now();
      running = true;
      tick();
    }
    updateButtons();
  }

  function lapOrReset() {
    if (running) {
      const total = now();
      laps.unshift(total - lastLapTotal);
      lastLapTotal = total;
      renderLaps();
    } else if (elapsed > 0) {
      elapsed = 0; lastLapTotal = 0; laps = [];
      display.textContent = fmt(0);
      renderLaps();
      updateButtons();
    }
  }

  function updateButtons() {
    startBtn.textContent = running ? '정지' : '시작';
    startBtn.classList.toggle('running', running);
    document.body.classList.toggle('running', running);
    document.getElementById('stageLabel').textContent =
      running ? '캐치캐치~ ♪' : elapsed ? '잠깐 쉬는 중…' : '시작을 누르면 춤춰요!';
    lapBtn.textContent = running || elapsed === 0 ? '랩' : '초기화';
    lapBtn.disabled = !running && elapsed === 0;
  }

  function renderLaps() {
    const min = Math.min(...laps), max = Math.max(...laps);
    lapsEl.innerHTML = laps.map((t, i) => {
      let cls = '';
      if (laps.length > 1) cls = t === min ? 'best' : t === max ? 'worst' : '';
      return `<li class="${cls}"><span>랩 ${laps.length - i}</span><span>${fmt(t)}</span></li>`;
    }).join('');
  }

  startBtn.addEventListener('click', toggle);
  lapBtn.addEventListener('click', lapOrReset);
  document.addEventListener('keydown', e => {
    if (e.code === 'Space') { e.preventDefault(); toggle(); }
    else if (e.key === 'l' || e.key === 'L') { if (running) lapOrReset(); }
    else if (e.key === 'r' || e.key === 'R') { if (!running) lapOrReset(); }
  });
</script>
</body>
</html>
